<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud App Browser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: white; display: flex; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        .screen {
            width: 100%; max-width: 360px; min-width: 128px; height: 100vh; max-height: 480px;
            display: flex; flex-direction: column; position: relative; background: #1a1a1a;
        }

        /* Launcher Grid Layout */
        .grid { flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; align-content: start; scrollbar-width: none; }
        .grid::-webkit-scrollbar { display: none; }
        
        /* Grid App Box Items */
        .app-box { 
            aspect-ratio: 1/1; border-radius: 16px; background: #2a2a2a; display: flex; 
            justify-content: center; align-items: center; border: 4px solid transparent; 
            cursor: pointer; overflow: hidden; transition: transform 0.1s;
        }
        .app-box img { width: 100%; height: 100%; object-fit: cover; }
        .app-box:focus { border-color: #00aeef; transform: scale(1.05); outline: none; }

        /* Bottom Status Indicator Footer */
        .bottom-bar { background: #000; padding: 12px; text-align: center; font-weight: bold; font-size: 14px; color: #00aeef; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <div class="screen">
        <div class="grid" id="appGrid"></div>
        <div class="bottom-bar" id="footerLabel">Browser</div>
    </div>

<script>
// ========================================================
// 📱 APP BROWSER CONFIGURATION (EASY EDIT HERE)
// Put line by line: Name | App Website Link | JPG Image URL
// ========================================================
const myAppsData = `
X-Browser | https://shifat100.github.io/cloudfone/x-browser | data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTEyIDJDNi40OCAyIDIgNi40OCAyIDIgMXM0LjQ4IDEwgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bS0xIDE3LjkzYy0zLjk1LS40OS03LTMuODUtNy03LjkzIDAtLjYyLjA4LTEuMjEuMjEtMS43OUw5IDE1djFjMCAxLjEuOSAyIDIgMnYxLjkzem02LjktMi41NGMtLjI2LS44MS0xLTEuMzktMS45LTEuMzloLTF2LTNjMC0uNTUtLjQ1LTEtMS0xSDh2LTJoMmMuNTUgMCAxLS40NSAxLTFWN2gyYzEuMSAwIDItLjkgMi0ydi0uNDFjMi45MyAxLjE5IDUgNC4wNiA1IDcuNDEgMCAyLjA4LS44IDMuOTctMi4xIDUuMzl6Ii8+PC9zdmc+
Cloud Photos | https://photos.cloudphone.tech/ | https://photos.cloudphone.tech/photos_logo_title.svg
`;

// Global variables tracking the interface items
let appItems = [];
let currentFocusIndex = 0;

// Convert the simple text format into dynamic screen items
const loadApps = () => {
    const grid = document.getElementById('appGrid');
    grid.innerHTML = '';
    appItems = [];

    myAppsData.split('\n').forEach(line => {
        const cleanLine = line.trim();
        if (!cleanLine || !cleanLine.includes('|')) return;

        const [name, appUrl, imageUrl] = cleanLine.split('|').map(s => s.trim());
        
        const box = document.createElement('div');
        box.className = 'app-box';
        box.tabIndex = 0;
        box.setAttribute('data-name', name);
        
        const img = document.createElement('img');
        img.src = imageUrl || '';
        img.alt = name;
        box.appendChild(img);
        
        box.onclick = () => { window.location.href = appUrl; };
        grid.appendChild(box);
        appItems.push(box);
    });

    updateSelection();
};

const updateSelection = () => {
    if (appItems.length === 0) return;
    if (currentFocusIndex >= appItems.length) currentFocusIndex = appItems.length - 1;
    if (currentFocusIndex < 0) currentFocusIndex = 0;

    const targetElement = appItems[currentFocusIndex];
    targetElement.focus({ preventScroll: true });
    
    document.getElementById('footerLabel').innerText = "Select App: " + targetElement.getAttribute('data-name');
    targetElement.scrollIntoView({ block: "center", behavior: "smooth" });
};

// Keypad/D-Pad focus management logic
window.onkeydown = (e) => {
    const totalItems = appItems.length;
    if (totalItems === 0) return;

    if (e.key === 'ArrowRight') {
        if (currentFocusIndex < totalItems - 1) currentFocusIndex++;
    } else if (e.key === 'ArrowLeft') {
        if (currentFocusIndex > 0) currentFocusIndex--;
    } else if (e.key === 'ArrowDown') {
        if (currentFocusIndex + 3 < totalItems) currentFocusIndex += 3;
        else currentFocusIndex = totalItems - 1;
    } else if (e.key === 'ArrowUp') {
        if (currentFocusIndex - 3 >= 0) currentFocusIndex -= 3;
    } else if (e.key === 'Enter') {
        appItems[currentFocusIndex].click();
    } else if (e.key === 'Backspace') {
        e.preventDefault();
    }
    updateSelection();
};

window.onload = loadApps;
</script>

</body>
  </html>
